name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo build --verbose
    - name: Run all tests
      run: cargo test --verbose --all
    - name: Run all targets tests
      run: cargo test --verbose --all-targets
    - name: Install mdBook and Mermaid preprocessor
      run: cargo install mdbook mdbook-mermaid
    - name: Build lib for book tests
      run: cargo build --lib
      env:
        CARGO_TARGET_DIR: target/book
    - name: Test book examples
      run: mdbook test -L target/book/debug/deps
