name: Books and GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Pull requests build independently. Never interrupt a production deployment.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache book tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-mermaid
          key: book-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pages/install-tools.sh') }}
      - name: Install pinned mdBook and Mermaid preprocessor
        run: bash pages/install-tools.sh
      - name: Build crate lib for book tests
        working-directory: v1
        run: cargo build --locked --lib
        env:
          CARGO_TARGET_DIR: target/book
      - name: Test book examples
        working-directory: v1
        run: mdbook test -L target/book/debug/deps
      - name: Build both books and root redirect
        run: bash pages/build.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
