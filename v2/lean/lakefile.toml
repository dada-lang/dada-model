name = "dada_model"
version = "0.1.0"
defaultTargets = ["Common", "Unique", "Shared", "Functions", "Destructors", "Correspondence"]

[[lean_lib]]
name = "Common"
globs = ["Common.+"]

[[lean_lib]]
name = "Unique"
globs = ["Unique.+"]

[[lean_lib]]
name = "Shared"
globs = ["Shared.+"]

[[lean_lib]]
name = "Correspondence"
globs = ["Correspondence.+"]

[[lean_lib]]
name = "Functions"
globs = ["Functions.+"]

[[lean_lib]]
name = "Destructors"
globs = ["Destructors.+"]
