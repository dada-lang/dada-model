[book]
authors = ["Niko Matsakis"]
language = "en"
src = "md"
title = "Dada: a literate specification"

[preprocessor.dada]
command = "cargo run --quiet --manifest-path mdbook-dada/Cargo.toml --"
renderers = ["html"]
after = ["index"]
lean-source = "lean"

[output.html]
site-url = "/dada-model/v2/"
# mdBook's built-in integration loads MathJax 2.7.1. Use our pinned loader.
mathjax-support = false
additional-css = ["theme/dada.css"]
additional-js = ["theme/mathjax.js"]
default-theme = "light"
